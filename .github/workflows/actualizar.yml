name: Actualizar normas ambientales

on:
  schedule:
    - cron: "40 12 * * *"   # todos los días 7:40 a. m. hora de Lima
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Revisar El Peruano
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "normas-bot"
          git config user.email "normas-bot@users.noreply.github.com"
          git add normas.json
          git diff --cached --quiet || git commit -m "Normas ambientales $(TZ=America/Lima date +%F)"
          git push
